name: Validate audio manifests

on:
  pull_request:
    paths:
      - "library-manifest.json"
      - "reciters/**"
      - "scripts/**"
  push:
    branches: [main]
    paths:
      - "library-manifest.json"
      - "reciters/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/validate-manifests.mjs
